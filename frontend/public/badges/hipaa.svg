<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="#1E1B4B" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3 2"/>
  
  <!-- Inner Background -->
  <circle cx="60" cy="60" r="44" fill="#312E81"/>
  
  <!-- Medical Cross / Shield Icon on top -->
  <rect x="56" y="20" width="8" height="16" rx="2" fill="#EF4444"/>
  <rect x="52" y="24" width="16" height="8" rx="2" fill="#EF4444"/>
  <rect x="57" y="21" width="6" height="14" fill="#FFFFFF"/>
  <rect x="53" y="25" width="14" height="6" fill="#FFFFFF"/>
  
  <!-- Main HIPAA Title -->
  <text x="60" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HIPAA</text>
  
  <!-- Ribbon Banner COMPLIANT -->
  <rect x="25" y="70" width="70" height="15" rx="3" fill="#4338CA"/>
  <text x="60" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">COMPLIANT</text>
  
  <!-- Subtext HITECH / ePHI -->
  <text x="60" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#C7D2FE" text-anchor="middle" letter-spacing="0.5">HITECH &amp; ePHI SAFE</text>
  
  <!-- Gold Stars bottom -->
  <polygon points="48,103 49,105 52,105 50,106.5 51,109 48,107.5 45,109 46,106.5 44,105 47,105" fill="#FBBF24"/>
  <polygon points="60,103 61,105 64,105 62,106.5 63,109 60,107.5 57,109 58,106.5 56,105 59,105" fill="#FBBF24"/>
  <polygon points="72,103 73,105 76,105 74,106.5 75,109 72,107.5 69,109 70,106.5 68,105 71,105" fill="#FBBF24"/>
</svg>
