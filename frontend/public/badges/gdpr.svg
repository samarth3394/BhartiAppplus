<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Outer Ring in EU Dark Blue -->
  <circle cx="60" cy="60" r="56" fill="#0F172A" stroke="#D97706" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 2"/>
  
  <!-- Inner Background in EU Deep Blue -->
  <circle cx="60" cy="60" r="44" fill="#1E293B"/>
  
  <!-- 12 EU Gold Stars in circle around center -->
  <g fill="#FBBF24" transform="translate(60,40)">
    <!-- 8 surrounding stars -->
    <polygon points="0,-16 1.5,-12 5,-12 2,-10 3.5,-6 0,-8.5 -3.5,-6 -2,-10 -5,-12 -1.5,-12"/>
    <polygon points="12,-11 13.5,-7 17,-7 14,-5 15.5,-1 12,-3.5 8.5,-1 10,-5 7,-7 10.5,-7"/>
    <polygon points="16,0 17.5,4 21,4 18,6 19.5,10 16,7.5 12.5,10 14,6 11,4 14.5,4"/>
    <polygon points="-12,-11 -10.5,-7 -7,-7 -10,-5 -8.5,-1 -12,-3.5 -15.5,-1 -14,-5 -17,-7 -13.5,-7"/>
    <polygon points="-16,0 -14.5,4 -11,4 -14,6 -12.5,10 -16,7.5 -19.5,10 -18,6 -21,4 -17.5,4"/>
  </g>
  
  <!-- Main Title GDPR -->
  <text x="60" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GDPR</text>
  
  <!-- Sub Banner CCPA / EU -->
  <rect x="25" y="73" width="70" height="15" rx="3" fill="#D97706"/>
  <text x="60" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CCPA / EU</text>
  
  <!-- Subtext DATA PRIVACY -->
  <text x="60" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="0.5">SOVEREIGN PRIVACY</text>
</svg>
