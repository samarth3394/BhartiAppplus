<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Outer Ring with Certificate Notches -->
  <circle cx="60" cy="60" r="56" fill="#042F2E" stroke="#059669" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4 2"/>
  
  <!-- Inner Background -->
  <circle cx="60" cy="60" r="44" fill="#064E3B"/>
  
  <!-- ISO Header Arc -->
  <path id="isoArc" d="M 28 50 A 36 36 0 0 1 92 50" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#34D399" letter-spacing="2">
    <textPath href="#isoArc" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>
  
  <!-- ISO Text -->
  <text x="60" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO</text>
  
  <!-- 27001 Badge -->
  <rect x="26" y="72" width="68" height="15" rx="3" fill="#059669"/>
  <text x="60" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">27001:2022</text>
  
  <!-- Subtext ISMS -->
  <text x="60" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="0.5">INFO SECURITY ISMS</text>
  
  <!-- Verified Checkmark / Globe on top -->
  <circle cx="60" cy="26" r="8" fill="#10B981"/>
  <path d="M56 26 L59 29 L65 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

