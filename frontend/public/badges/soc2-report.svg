<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <!-- Official Document Binder -->
  <rect x="18" y="10" width="46" height="60" rx="5" fill="#1E40AF" stroke="#60A5FA" stroke-width="2"/>
  
  <!-- Document Fold Corner -->
  <path d="M50 10 L64 24 L50 24 Z" fill="#3B82F6"/>
  <path d="M50 10 L64 24" stroke="#93C5FD" stroke-width="1.5"/>
  
  <!-- Security Shield Stamp on Document -->
  <circle cx="41" cy="44" r="16" fill="#0A2540" stroke="#FBBF24" stroke-width="1.5"/>
  <path d="M 41 33 L 49 37 C 49 46 44 51 41 53 C 38 51 33 46 33 37 Z" fill="#2563EB" stroke="#FBBF24" stroke-width="1.2"/>
  
  <!-- Checkmark inside Shield -->
  <path d="M37 43 L40 46 L46 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text lines on top of report -->
  <line x1="26" y1="20" x2="44" y2="20" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="26" x2="42" y2="26" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Official Gold Seal Star -->
  <circle cx="24" cy="58" r="4" fill="#FBBF24"/>
  <path d="M22 62 L20 68 L24 65 L28 68 L26 62" fill="#D97706"/>
</svg>
